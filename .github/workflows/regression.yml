name: regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression scripts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            echo "==> $test_file"
            python3 "$test_file"
          done
